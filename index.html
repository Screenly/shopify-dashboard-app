<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopify Dashboard - Screenly Edge App</title>
    <script src="screenly.js?version=1"></script>
  </head>
  <body>
    <auto-scaler
      reference-width="1920"
      reference-height="1080"
      orientation="auto"
    >
      <div id="app">
        <app-header class="header" show-date></app-header>
        <main class="content">
          <div id="dashboard" hidden>
            <div class="dashboard-toolbar">
              <h1 id="shop-name" class="shop-name"></h1>
              <div
                id="date-range-switcher"
                class="date-range-switcher"
                role="group"
                aria-label="Date range"
              >
                <button
                  type="button"
                  class="date-range-option"
                  data-range="today"
                  aria-pressed="false"
                >
                  Today
                </button>
                <button
                  type="button"
                  class="date-range-option"
                  data-range="7d"
                  aria-pressed="false"
                >
                  7D
                </button>
                <button
                  type="button"
                  class="date-range-option"
                  data-range="30d"
                  aria-pressed="false"
                >
                  30D
                </button>
              </div>
            </div>

            <section class="kpi-grid">
              <article class="kpi-card">
                <span id="kpi-label-total-sales" class="kpi-label"
                  >Total Sales (30D)</span
                >
                <span id="kpi-total-sales" class="kpi-value"></span>
              </article>
              <article class="kpi-card">
                <span id="kpi-label-orders" class="kpi-label"
                  >Orders (30D)</span
                >
                <span id="kpi-orders" class="kpi-value"></span>
              </article>
              <article class="kpi-card">
                <span id="kpi-label-sessions" class="kpi-label"
                  >Sessions (30D)</span
                >
                <span id="kpi-sessions" class="kpi-value"></span>
              </article>
              <article class="kpi-card">
                <span id="kpi-label-conversion-rate" class="kpi-label"
                  >Conversion Rate (30D)</span
                >
                <span id="kpi-conversion-rate" class="kpi-value"></span>
              </article>
            </section>

            <section class="orders-card">
              <h2 class="orders-title">Recent Orders</h2>
              <table class="orders-table">
                <thead>
                  <tr>
                    <th>Order</th>
                    <th>Date</th>
                    <th>Total</th>
                    <th>Payment</th>
                    <th>Fulfillment</th>
                  </tr>
                </thead>
                <tbody id="orders-body"></tbody>
              </table>
              <p id="orders-empty" class="orders-empty" hidden>
                No orders yet.
              </p>
            </section>
          </div>

          <div id="error-screen" hidden>
            <div class="error-card">
              <div class="error-card-left">
                <h2>Something went wrong</h2>
                <p>
                  The Shopify data could not be loaded. Please check your
                  configuration or contact your administrator.
                </p>
              </div>
              <div class="error-card-right">
                <div class="error-detail-label">Error details</div>
                <p id="error-message" class="error-detail-message"></p>
              </div>
            </div>
          </div>
        </main>
      </div>
    </auto-scaler>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
