---
syntax: manifest_v1
description: Display Shopify store sales metrics on your Screenly digital signage screens
icon: https://playground.srly.io/edge-apps/icons/shopify.svg
author: Screenly, Inc.
categories:
  - Dashboards
ready_signal: true
settings:
  access_token:
    type: secret
    title: Access Token
    optional: true
    help_text:
      properties:
        help_text: For testing only. In production, the access token is fetched dynamically via the Screenly OAuth service.
        type: oauth:shopify:access_token
      schema_version: 1
  api_version:
    type: string
    default_value: '2026-07'
    title: API Version
    optional: true
    help_text:
      properties:
        advanced: true
        help_text: The Shopify Admin API version used for GraphQL requests.
      schema_version: 1
  chart_type:
    type: string
    default_value: auto
    title: Chart Type
    optional: true
    help_text:
      properties:
        help_text: Preferred chart style for the Total Sales Over Time and Total Sales By Product views. Auto picks the best fit for each view (line for the time series, bar for the product comparison). Ignored by views that don't support it (Summary View, Total Sales Breakdown), and by chart types that don't fit a given view.
        options:
          - label: Auto
            value: auto
          - label: Line
            value: line
          - label: Bar
            value: bar
          - label: Donut
            value: donut
        type: select
      schema_version: 1
  default_date_range:
    type: string
    default_value: 30d
    title: Default Date Range
    optional: true
    help_text:
      properties:
        help_text: The date range shown on the dashboard when it loads. Can still be changed on-screen using the switcher.
        options:
          - label: Today
            value: today
          - label: 7 Days
            value: 7d
          - label: 30 Days
            value: 30d
        type: select
      schema_version: 1
  display_errors:
    type: string
    default_value: 'false'
    title: Display Errors
    optional: true
    help_text:
      properties:
        advanced: true
        help_text: For debugging purposes to display errors on the screen.
        type: boolean
      schema_version: 1
  override_locale:
    type: string
    default_value: ''
    title: Override Locale
    optional: true
    help_text: |
      Override the default locale with a supported language code (e.g., en, fr, de). Defaults to English if not specified.
  override_timezone:
    type: string
    default_value: ''
    title: Override Timezone
    optional: true
    help_text: |
      Override the default timezone with a supported timezone identifier (e.g., Europe/London, America/New_York). Defaults to the system timezone if left blank.
  refresh_interval:
    type: string
    default_value: '300'
    title: Refresh Interval (seconds)
    optional: true
    help_text:
      properties:
        advanced: true
        help_text: How often to refresh Shopify data. Defaults to 300 seconds.
        type: number
      schema_version: 1
  shop_domain:
    type: string
    title: Shop Domain
    optional: false
    help_text: |
      The myshopify.com domain of the store to display data from (e.g. my-store.myshopify.com). In production, this is provided by the Shopify integration.
  view:
    type: string
    default_value: summary
    title: View
    optional: true
    help_text:
      properties:
        help_text: Which single view to show on screen. Digital signage is passive viewing with no on-screen interaction, so this is fixed per install rather than switchable on the device.
        options:
          - label: Summary View
            value: summary
          - label: Total Sales Over Time
            value: sales_over_time
          - label: Total Sales By Product
            value: sales_by_product
          - label: Total Sales Breakdown
            value: sales_breakdown
        type: select
      schema_version: 1
